name: Preview worker

on:
  push:
    branches:
      - cursor/verse-groups-preview-ff97
      - cursor/url-external-refs-d392
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    # The Cloudflare token lives on this environment. The script still
    # publishes worker margin-bible-verse-groups, not margin-bible.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-verse-groups
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0
          install: true
          cache: true
      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
      - name: Deploy preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/preview-worker.sh
