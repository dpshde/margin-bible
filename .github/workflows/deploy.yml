name: Deploy

# Optional production deploy to Cloudflare Workers.
# Requires repository secrets (not present yet as of 2026-09-30 SoT cutover):
#   CLOUDFLARE_API_TOKEN   — Workers/D1 edit token
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
# Until those are set, this workflow is manual-only and will fail at authenticate.
# Live SoT deploys today are done from the box via `wrangler deploy` (wrangler login).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0
          install: true
          cache: true
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun test
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            echo "Until then, deploy from the box: cd prod/workers && bunx wrangler deploy"
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
