name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --experimental-default-type=module test/javascript/outliner-blocks.test.js && node --experimental-default-type=module test/javascript/passage-span.test.js && node --experimental-default-type=module test/javascript/chapter-swipe.test.js && node --experimental-default-type=module test/javascript/guest-pack.test.js && node --experimental-default-type=module test/javascript/passkey-hint.test.js && node --experimental-default-type=module test/javascript/webauthn.test.js && node --experimental-default-type=module test/javascript/sign-out-snapshot.test.js && node --experimental-default-type=module test/javascript/chrome-hide.test.js && node --experimental-default-type=module test/javascript/expand-notes.test.js && node --experimental-default-type=module test/javascript/chapter-grid.test.js && node --experimental-default-type=module test/javascript/xref-peek.test.js && node --experimental-default-type=module test/javascript/verse-host.test.js && node --experimental-default-type=module test/javascript/share-text.test.js && node --experimental-default-type=module test/javascript/clipboard-copy.test.js && node --experimental-default-type=module test/javascript/dock-menu.test.js
      - run: bin/rails db:test:prepare
      - run: bin/rails test
