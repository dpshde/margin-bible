name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0
          install: true
          cache: true
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun test
