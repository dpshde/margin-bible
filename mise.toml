[tools]
bun = "1.4.2"
node = "22.23.3"
# Pin the beta. An unpinned `cf` install resolves to an unrelated 0.x package.
"npm:cf" = "1.0.0-beta.13"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
CF_SEND_TELEMETRY = "false"

[tasks.install]
description = "Install JS dependencies from bun.lock"
run = "mise exec -- bun install --frozen-lockfile"

[tasks.check]
description = "Typecheck (tsc --noEmit)"
run = "mise exec -- bun run check"

[tasks.test]
description = "Run bun tests"
run = "mise exec -- bun test"

[tasks.ci]
description = "What GitHub runs before a Worker can publish"
depends = ["install"]
run = ["mise exec -- bun run check", "mise exec -- bun test", "mise exec -- bun run dry-run"]

[tasks.deploy]
description = "Publish the Worker with cf, then confirm /health"
depends = ["install"]
run = "sh scripts/deploy.sh"

[tasks."cf:whoami"]
description = "Show the Cloudflare identity cf will use"
run = "sh scripts/cf-whoami.sh"

[tasks."d1:local"]
description = "Apply D1 migrations to the local database used by cf dev"
run = "mise exec -- bun run migrate:local"

[tasks."d1:remote"]
description = "Apply unapplied D1 migrations on the remote database. Not part of deploy."
run = "sh scripts/d1-remote.sh"

[tasks.profile]
description = "On-demand CPU or memory profile of the deployed Worker: mise run profile [worker] [cpu|memory] [duration_ms]"
env = { CF_PROFILE_WORKER = "margin-bible" }
run = "sh scripts/cf-profile.sh"
